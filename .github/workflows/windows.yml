name: Nider Etapas para Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilar e empacotar
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.0.12' }
          $v = ($tag -split '-')[0]
          dotnet publish src/Trilha -c Release -p:Version=$v -o dist/app
          if ($LASTEXITCODE -ne 0) { throw "falha ao compilar" }
          # Um .exe só, no padrão da família (nider-text-setup-…, nider-pdf-setup-…). O próprio
          # NiderEtapas.exe é o instalador: aberto fora da pasta de instalação, mostra o painel.
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/app/NiderEtapas.exe "dist/release/nider-etapas-setup-$tag-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: NiderEtapas-Windows
          path: dist/release/*.exe
          if-no-files-found: error
      - name: Publicar versão no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/release/*.exe --title "Nider Etapas ${GITHUB_REF_NAME}" \
            --notes "Nider Etapas para Windows. Abra o instalador e clique em Instalar (ou Atualizar)."
