name: Nider Etapas para Windows

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Publicar esta versão (ex.: 2.0.12). Vazio = só compilar, sem publicar."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilar e empacotar
        shell: pwsh
        run: |
          $pub = "${{ github.event.inputs.versao }}".Trim().TrimStart('v')
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } elseif ($pub) { $pub } else { '2.0.12' }
          $v = ($tag -split '-')[0]
          dotnet publish src/Trilha -c Release -p:Version=$v -o dist/app
          if ($LASTEXITCODE -ne 0) { throw "falha ao compilar" }
          # Um .exe só, no padrão da família (nider-text-setup-…, nider-pdf-setup-…). O próprio
          # NiderEtapas.exe é o instalador: aberto fora da pasta de instalação, mostra o painel.
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/app/NiderEtapas.exe "dist/release/nider-etapas-setup-$tag-windows-x64.exe"
      - name: Prévia da logo vetorial (WPF real, 256/48/32/16 px)
        shell: pwsh
        run: |
          Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
          $dict = [Windows.Markup.XamlReader]::Load([IO.File]::OpenRead("src/Trilha/Logo.xaml"))
          $img = $dict["NiderLogo"]
          $sizes = 256, 48, 32, 16
          $w = ($sizes | Measure-Object -Sum).Sum + 60
          $dv = New-Object Windows.Media.DrawingVisual
          $dc = $dv.RenderOpen()
          $dc.DrawRectangle([Windows.Media.Brushes]::DimGray, $null, (New-Object Windows.Rect 0, 0, $w, 276))
          $x = 10
          foreach ($s in $sizes) { $dc.DrawImage($img, (New-Object Windows.Rect $x, 10, $s, $s)); $x += $s + 10 }
          $dc.Close()
          $bmp = New-Object Windows.Media.Imaging.RenderTargetBitmap $w, 276, 96, 96, ([Windows.Media.PixelFormats]::Pbgra32)
          $bmp.Render($dv)
          $enc = New-Object Windows.Media.Imaging.PngBitmapEncoder
          $enc.Frames.Add([Windows.Media.Imaging.BitmapFrame]::Create($bmp))
          $fs = [IO.File]::Create("logo-preview.png"); $enc.Save($fs); $fs.Close()
      - uses: actions/upload-artifact@v4
        with:
          name: logo-preview
          path: logo-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: NiderEtapas-Windows
          path: dist/release/*.exe
          if-no-files-found: error
      - name: Notas da versão (o que mudou desde a versão anterior)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          atual="${GITHUB_REF_NAME}"
          git rev-parse -q --verify "refs/tags/$atual" >/dev/null || atual="HEAD"
          anterior=$(git describe --tags --abbrev=0 --match 'v*' "$atual^" 2>/dev/null || true)
          {
            echo "## O que há de novo"
            echo
            git log ${anterior:+$anterior..}$atual --no-merges --pretty='- %s' \
              | grep -v -i -E 'dependabot|^- (bump|chore\(deps\)|ci\(deps\))|ui_shot|^- Merge |^- (Compilação|Empacotamento)' | head -40 || true
            echo
            echo "_Se o Windows avisar que o aplicativo não é reconhecido, clique em **Mais informações** e depois em **Executar assim mesmo**._"
          } > notas.md
          cat notas.md
      - name: Publicar versão no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/release/*.exe --title "Nider Etapas ${GITHUB_REF_NAME}" \
            --notes-file notas.md
      # Publicação sem tag manual: "Run workflow" com a versão preenchida cria a tag e a release
      # (útil quando quem publica não pode empurrar tags, como as sessões remotas).
      - name: Publicar versão pedida no "Run workflow"
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.versao != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ github.event.inputs.versao }}
        run: |
          v="v${VERSAO#v}"
          gh release create "$v" dist/release/*.exe --target "$GITHUB_SHA" --title "Nider Etapas $v" \
            --notes-file notas.md
