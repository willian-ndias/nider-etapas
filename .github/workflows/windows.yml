name: Nider Etapas para Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilar e empacotar
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.0.8' }
          $v = ($tag -split '-')[0]
          dotnet publish src/Trilha -c Release -p:Version=$v -o dist/app
          if ($LASTEXITCODE -ne 0) { throw "falha ao compilar" }
          New-Item -ItemType Directory -Force dist/zip | Out-Null
          Copy-Item dist/app/NiderEtapas.exe dist/zip/
          Copy-Item LEIA-ME.txt dist/zip/
          Compress-Archive -Path dist/zip/* -DestinationPath NiderEtapas-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NiderEtapas-Windows
          path: NiderEtapas-Windows.zip
          if-no-files-found: error
      - name: Publicar versão no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" NiderEtapas-Windows.zip --title "Nider Etapas ${GITHUB_REF_NAME}" \
            --notes "Nider Etapas para Windows. Extraia o zip e abra o NiderEtapas.exe."
